# Pi 5 Local Note — force HFP/HSP to CVSD (basic-rate EV3 packets).
# Install: sudo cp deploy/wireplumber.conf.d/51-bluez-cvsd.conf /etc/wireplumber/wireplumber.conf.d/
#          systemctl --user restart wireplumber
# Measured 2026-10-22 on raspi543: mSBC (EDR 2-EV3) frames arrive 30–65% corrupted on this
# CYW43455 link (HCI pkt_status=1), giving 20–70% silence after decode failures; CVSD gives ~2–20%.
monitor.bluez.properties = {
  bluez5.enable-msbc = false
}
