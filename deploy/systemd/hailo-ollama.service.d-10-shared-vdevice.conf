# 安裝：sudo install -D -m 644 deploy/systemd/hailo-ollama.service.d-10-shared-vdevice.conf \
#         /etc/systemd/system/hailo-ollama.service.d/10-shared-vdevice.conf
#       sudo systemctl daemon-reload && sudo systemctl restart hailo-ollama.service pi5-dispatcher-api.service
# 作用：hailo-ollama 與 Whisper (stt_worker) 共用 Hailo-10H (hailo-gen-ai-model-zoo >= 5.3.0，見其 docs/USAGE.rst)。
# app 會讀取執行中 hailo-ollama 的這個環境變數，自動以相同 group_id 開 Whisper 並讓兩者常駐 (code_dispatcher/npu_share.py)。
# 移除這個檔案 (或 app 設 PI5_NPU_SHARE=0) 即回到獨占模式。
[Service]
Environment=HAILO_OLLAMA_VDEVICE_GROUP_ID=HAILO_OLLAMA_SHARED
