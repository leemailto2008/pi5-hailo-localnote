# LocalNote CI/CD (GitLab)
#   unit           : 任何 runner (docker)；離線單元測試 (audio_splice / summary_utils / scoring / fixtures)
#   deploy_raspi678: Pi 上的 shell runner (tag raspi678，以 pi 使用者執行)；部署 + 健康檢查，失敗自動回滾
#   hil_quick      : main 每次 push：1 / 3 分鐘測試會議 (約 10 分鐘)
#   hil_full       : 排程 (nightly) 或手動：1/3/5/10/15/30 分鐘 (約 2 小時)
stages: [test, deploy, hil]

variables:
  LN_E2E_DATA: /home/pi/ln_e2e/data
  PYTHONUNBUFFERED: "1"

unit:
  stage: test
  image: python:3.13-slim
  script:
    - pip install -q -r requirements-dev.txt
    - python -m pytest -q tests --junitxml=unit.xml
  artifacts:
    when: always
    reports: { junit: unit.xml }

deploy_raspi678:
  stage: deploy
  tags: [raspi678]
  resource_group: raspi678
  environment: { name: raspi678 }
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - bash tools/ci/deploy_on_pi.sh "$CI_PROJECT_DIR"

hil_quick:
  stage: hil
  tags: [raspi678]
  resource_group: raspi678
  needs: [deploy_raspi678]
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - bash tools/ci/prepare_test_data.sh 1 3
    - python3 tools/e2e/run_suite.py --minutes 1 3 --data "$LN_E2E_DATA" --out e2e_reports/quick --junit hil_quick.xml
  artifacts:
    when: always
    paths: [e2e_reports/]
    reports: { junit: hil_quick.xml }

hil_full:
  stage: hil
  tags: [raspi678]
  resource_group: raspi678
  needs: [deploy_raspi678]
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  script:
    - bash tools/ci/prepare_test_data.sh 1 3 5 10 15 30
    - python3 tools/e2e/run_suite.py --minutes 1 3 5 10 15 30 --data "$LN_E2E_DATA" --out e2e_reports/full --junit hil_full.xml
  artifacts:
    when: always
    paths: [e2e_reports/]
    reports: { junit: hil_full.xml }
